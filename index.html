<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala de Trabalho</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f2f2f2;
    }
    h1 {
      color: #007bff;
    }
    .escala {
      margin-top: 30px;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .escala h2 {
      margin-bottom: 20px;
    }
    .escala ul {
      list-style: none;
      padding: 0;
      text-align: left;
    }
    .escala li {
      padding: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Escala de Trabalho</h1>
  <div class="escala">
    <h2>03/05/2025</h2>
    <ul>
      <li><strong>Recepção:</strong> Bruno</li>
      <li><strong>Recepção:</strong> Alberto</li>
      <li><strong>Ronda:</strong> Rafael</li>
      <li><strong>Portaria:</strong> Moisés</li>
      <li><strong>Portaria:</strong> Franco</li>
      <li><strong>Guarita Bravo:</strong> Janayna</li>
      <li><strong>Cais Delta:</strong> Thiago</li>
    </ul>
  </div>
</body>
</html>
