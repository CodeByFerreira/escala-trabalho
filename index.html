<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escala de Trabalho</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #007bff;
    }
    .escala {
      max-width: 600px;
      margin: 20px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .escala h2 {
      margin-top: 0;
    }
    .escala ul {
      list-style: none;
      padding: 0;
    }
    .escala li {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }
    .escala li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h1>Escala de Trabalho</h1>
  <div class="escala">
    <h2>03/05/2025</h2>
    <ul>
      <li><strong>Recepção:</strong> Bruno</li>
      <li><strong>Recepção:</strong> Alberto</li>
      <li><strong>Ronda:</strong> Rafael</li>
      <li><strong>Portaria:</strong> Moisés</li>
      <li><strong>Portaria:</strong> Franco</li>
      <li><strong>Guarita Bravo:</strong> Janayna</li>
      <li><strong>Cais Delta:</strong> Thiago</li>
    </ul>
  </div>
</body>
</html>
